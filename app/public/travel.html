<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FairShare Travel</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="travel-page">
    <h1>Travel</h1>

    <div>
      <h2 id="trip-name">Trip</h2>
      <p id="trip-destination"></p>
      <p id="trip-dates"></p>
    </div>

    <h2>Search Flights</h2>

    <label for="origin">Flying From:</label>
    <input id="origin" type="text" placeholder="PHL" />

    <br /><br />

    <label for="travelers">Travelers:</label>
    <input id="travelers" type="number" value="1" min="1" />

    <br /><br />

    <button id="search-flights">Search Flights</button>

    <p id="message"></p>

    <div id="flight-results"></div>

    <hr />

    <h2>Search Hotels</h2>

    <label for="guests">Guests:</label>
    <input id="guests" type="number" value="2" min="1" />

    <br /><br />

    <button id="search-hotels">Search Hotels</button>

    <p id="hotel-message"></p>

    <div id="hotel-results"></div>

    <hr />

    <h2>Search Activities</h2>

    <button id="search-activities">Search Activities</button>

    <p id="activity-message"></p>

    <div id="activity-results"></div>

    <script src="travel.js"></script>
  </body>
</html>
