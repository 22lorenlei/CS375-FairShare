<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>FairShare - Travel</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="container">
      <div id="trip-header"></div>

      <div class="trip-content travel-page">
        <h2>Travel</h2>

        <p class="subtitle">
          Search for flights, hotels, and activities for this trip.
        </p>

        <hr />

        <h2>Search Flights</h2>

        <label for="origin">Flying From</label>

        <input id="origin" type="text" placeholder="PHL" />

        <br /><br />

        <button id="search-flights" class="dark-button">Search Flights</button>

        <p id="message"></p>

        <div id="flight-results"></div>

        <hr />

        <h2>Search Hotels</h2>

        <button id="search-hotels" class="dark-button">Search Hotels</button>

        <p id="hotel-message"></p>

        <div id="hotel-results"></div>

        <hr />

        <h2>Search Activities</h2>

        <button id="search-activities" class="dark-button">
          Search Activities
        </button>

        <p id="activity-message"></p>

        <div id="activity-results"></div>
      </div>
    </main>

    <script src="trip-navbar.js"></script>
    <script src="travel.js"></script>
  </body>
</html>
