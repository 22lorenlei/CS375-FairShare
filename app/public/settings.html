<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairShare - Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="container">
        <h1 class="settings-title">Profile / Settings</h1>

        <div class="settings-layout">
            <div class="sidebar">
                <div class="dropdown">
                    <button id="account-info" class="sidebar-btn" type="button">Account ▾</button>
                    <div id="account-dropdown" class="dropdown-menu hidden">
                        <button id="btn-username" class="sub-btn" type="button">Change Username</button>
                        <button id="btn-password" class="sub-btn" type="button">Change Password</button>
                    </div>
                </div>

                <button id="payment-preferences" class="sidebar-btn" type="button">Payment Preferences</button>
                <button id="notification-settings" class="sidebar-btn" type="button">Notification Settings</button>
                <button id="friends" class="sidebar-btn" type="button">Friends</button>
		<button id="mail" class="sidebar-btn" type="button">Mail</button>
            </div>

            <div class="panel">

                <!-- Change Username Panel -->
                <div id="show-username" class="hidden">
                    <h2>Change Username</h2>
                    <form id="username-form" class="settings-form">
                        <label for="username">New Username</label>
                        <input type="text" id="username" minlength="3" maxlength="50" pattern="^[a-zA-Z0-9_]+$" required>
                        <div id="username-message" class="status-message"></div>
                        <button type="submit" class="dark-button">Save Username</button>
                        <p id="message-display" class="status-message"></p>
                    </form>
                </div>

                <!-- Change Password Panel -->
                <div id="show-password" class="hidden">
                    <h2>Change Password</h2>
                    <form id="password-form" class="settings-form">
                        <label for="current-password">Current Password</label>
                        <input type="password" id="current-password" placeholder="••••••••" minlength="8" maxlength="64" required>

                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" placeholder="••••••••" minlength="8" maxlength="64" required>

                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password" placeholder="••••••••" minlength="8" maxlength="64" required>

                        <div id="password-message" class="status-message"></div>
                        <button type="submit" class="dark-button">Update Password</button>
                    </form>
                </div>

                <div id="show-payment-preferences" class="hidden">
                    <h2>Payment Preferences</h2>
                    <p>To do later</p>
                </div>

                <div id="show-notification-settings" class="hidden">
                    <h2>Notification Settings</h2>
                    <p>To do later</p>
                </div>

                <div id="show-friends" class="hidden">
                    <h2>Friends</h2>
			<div class="friends-container">
				<div id="friends-table-message"> </div>
				<table id="current-friends-table" class="friends-table">
				</table>

				<div id="friends-form-div">
					<form id="add-friends-form" class="settings-form">
						<label> Enter Email: </label>
						<input id="friends-input" placeholder="e.g. testing2@gmail.com"> </input>
						<button id="add-friends" type="submit" class="dark-button"> Add Friends </button>
						<div id="friend-message" class="status-message"></div>
					</form>
				</div>
			</div>
                </div>

		<div id="show-mail" class="hidden">
			<h2> Incoming Friend Requests </h2>
			<div id="incoming-friends-table-message"> </div>
			<table id="incoming-friends-table" class="friends-table">
			</table>
		</div>
            </div>
        </div>
    </main>

    <script src="settings.js"></script>
</body>
</html>
