<!DOCTYPE html>
<html>

	<title>Create Trip</title>
</head>
<body>
	<h1> Create Trip Page </h1>

	<div>
		<label for="eventName">Trip Name:</label>
		<input id="eventName" type="text" name="eventName">
	</div>
	<div>
		<label for="costName">Destination Name:</label>
		<input id="costName" type="text" name="costName">
	</div>
	<div>
		<label for="startDate">Start Date:</label>
		<input id="startDate" type="text" name="startDate">
	</div>
	<div>
		<label for="endDate">End Date:</label>
		<input id="endDate" type="text" name="endDate">
	</div>
	<div>
		<label for="initalBudget">Total Budget:</label>
		<input id="endDate" type="text" name="endDate">
	</div>
	<div>
		<label for="groupMembers"> Search Group Members: </label>
		<input id="groupMembers" type="text" name="endDate">
		<button id="addGroupMember"> Add Group Member </button>
	</div>

	<!-- This is where the table should be when you add members --!>
	<!-- You should be able to delete too..., so a button per row? !-->

		<tbody id="addedFriends">
		</tbody>
	</table>

	<button id="submit">Create Trip</button>

	<div id="message"> </div>

	<script src="createTripPage.js"> </script>
