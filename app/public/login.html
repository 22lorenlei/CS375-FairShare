<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FairShare - Log In</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

    <form id="login-form">
        <div class="auth-container">
        <h1 class="brand-title">FairShare</h1>
        <p class="brand-subtitle">Plan Trips. Share Expenses. Travel Together.</p>

        <div class="tabs">
        <a class="tab active">Log In</a>
        </div>

        <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
        </div>

        <button type="submit" id="submit">Log In</button>
    </form>
    <div id="message"></div>

    <p class="footer-text">
      Don't have an account? <a href="register.html">Create an account</a>
    </p>
  </div>

  <script src="login.js"></script>
</body>
</html>
