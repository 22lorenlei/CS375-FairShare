<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FairShare - Log In</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="auth-container">
    <h1 class="brand-title">FairShare</h1>
    <p class="brand-subtitle">Plan Trips. Share Expenses. Travel Together.</p>

    <div class="tabs">
      <a href="login.html" class="tab active">Log In</a>
      <!--<a href="register.html" class="tab">Sign Up</a>-->
    </div>

    <div class="form-group">
      <label for="username">Email</label>
      <input type="text" id="username" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button id="submit">Log In</button>

    <div id="message"></div>

    <p class="footer-text">
      Don't have an account? <a href="register.html">Create an account</a>
    </p>
  </div>

  <script src="login.js"></script>
</body>
</html>
